version: "3.8"

services:
  # Next.js Application Server
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: startrek_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:startrek_secure_pass_2026@postgres:5432/startrek_prod?schema=public
      - JWT_SECRET=startrek_enterprise_super_secret_jwt_key_2026
      - NODE_ENV=production
    depends_on:
      - postgres

  # Enterprise PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: startrek_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: startrek_secure_pass_2026
      POSTGRES_DB: startrek_prod
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Nginx Reverse Proxy & SSL Gateway
  nginx:
    image: nginx:alpine
    container_name: startrek_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_etc:/etc/letsencrypt
    depends_on:
      - app

volumes:
  postgres_data:
  certbot_etc:
