<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="kdRedGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B52" />
      <stop offset="50%" stop-color="#E52D27" />
      <stop offset="100%" stop-color="#B31217" />
    </linearGradient>
    <linearGradient id="kdLightGradient" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FF9A76" />
      <stop offset="100%" stop-color="#FF5252" />
    </linearGradient>
  </defs>

  <!-- Outer Oval Ring -->
  <path d="M 60,150 C 60,70 140,40 230,40 C 320,40 370,80 340,150 C 310,220 230,260 130,260 C 50,260 60,200 60,150 Z" 
        fill="none" stroke="url(#kdRedGradient)" stroke-width="28" stroke-linecap="round" />

  <!-- Inner Swirl Curve K-D -->
  <path d="M 120,180 C 170,120 240,80 300,65 C 240,120 180,180 140,210 Z" 
        fill="url(#kdLightGradient)" />
  
  <path d="M 130,195 C 190,140 270,180 300,240 C 230,255 170,230 130,195 Z" 
        fill="url(#kdRedGradient)" />
</svg>
