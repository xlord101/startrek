<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="logoRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B52" />
      <stop offset="50%" stop-color="#E52D27" />
      <stop offset="100%" stop-color="#B31217" />
    </linearGradient>
    <linearGradient id="logoLight" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FF9A76" />
      <stop offset="100%" stop-color="#FF5252" />
    </linearGradient>
  </defs>

  <!-- KD Oval Emblem -->
  <g transform="translate(100, 20)">
    <path d="M 60,140 C 60,70 140,40 230,40 C 320,40 370,80 340,140 C 310,200 230,240 130,240 C 50,240 60,180 60,140 Z" 
          fill="none" stroke="url(#logoRed)" stroke-width="26" />
    <path d="M 120,165 C 170,115 240,75 290,60 C 235,110 180,165 140,195 Z" 
          fill="url(#logoLight)" />
    <path d="M 130,180 C 190,130 265,165 295,220 C 225,235 170,210 130,180 Z" 
          fill="url(#logoRed)" />
  </g>

  <!-- Registered Trademark Icon (R) -->
  <g transform="translate(490, 50)">
    <circle cx="20" cy="20" r="18" fill="none" stroke="#000000" stroke-width="3" />
    <text x="13" y="27" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#000000">R</text>
  </g>

  <!-- Typography: KD EXPORT -->
  <text x="300" y="380" 
        text-anchor="middle" 
        font-family="Georgia, 'Times New Roman', serif" 
        font-size="64" 
        font-weight="900" 
        letter-spacing="6" 
        fill="#D32F2F">
    KD EXPORT
  </text>
</svg>
